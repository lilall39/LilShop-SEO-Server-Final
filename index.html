<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Outil SEO Automatique – Lil Shop</title>
  <link rel="stylesheet" href="style.css">

  <!-- ✅ Correction affichage meta description -->
  <style>
    #resultMeta {
      white-space: pre-wrap;       /* permet les retours à la ligne */
      word-wrap: break-word;       /* casse les mots trop longs */
      overflow-wrap: break-word;   /* compatibilité moderne */
      max-width: 90%;              /* évite que ça colle aux bords */
      display: block;
      margin: 10px auto;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>🚀 Outil SEO Lil-Shop</h1>

  <section>
    <h2>2️⃣ Génération de contenu SEO</h2>
    <input type="text" id="nomProduit" placeholder="Nom du produit">
    <textarea id="descProduit" placeholder="Courte description..."></textarea><br>
   <button onclick="avantGeneration(); genererMeta()">Générer le titre + meta + hashtags</button>

    <button onclick="recommencer()">🔄 Recommencer</button>

    <pre id="resultMeta"></pre>
    <button id="copyMetaBtn" style="display:none;" onclick="copierMeta()">📋 Copier Titre + Meta</button>

    <h3>📦 Hashtags générés</h3>

    <div id="hashtagsVinted"></div>
    <button id="copyVintedBtn" style="display:none;" onclick="copierVinted()">📋 Copier Hashtags Vinted</button>

    <div id="hashtagsShopify"></div>
    <button id="copyShopifyBtn" style="display:none;" onclick="copierShopify()">📋 Copier Hashtags Shopify</button>

    <div id="copyMsg" class="copy-success"></div>
  </section>

  <footer>🧾 Lil-Shop – Outil SEO partagé</footer>

  <script src="script.js"></script>
<script>
function nettoyerTitre(titre) {
  titre = titre.replace(/\s+/g, ' ').trim();
  titre = titre.replace(/[.]{2,}/g, '.').replace(/[-]{2,}/g, '-');
  if (titre.length > 110) titre = titre.slice(0, 107) + "...";
  return titre;
}

function avantGeneration() {
  let champ = document.getElementById("nomProduit");
  champ.value = nettoyerTitre(champ.value);
}
</script>


</body>
</html>
